<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f2">
  <title>FoodCheck</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
  <header>
    <div>
      <h1>FoodCheck</h1>
      <p>مساعد بسيط لاختيار الطعام</p>
    </div>
    <button id="settingsBtn" class="ghost">⚙️</button>
  </header>

  <section class="card hero">
    <h2>افحص منتجًا</h2>
    <p>امسح الباركود أو اكتب رقمه. التقييم إرشادي وليس تشخيصًا طبيًا.</p>
    <button id="scanBtn" class="primary">📷 Scan Barcode</button>
    <div class="manual">
      <input id="barcode" inputmode="numeric" placeholder="مثال: 871..." aria-label="Barcode">
      <button id="lookupBtn">بحث</button>
    </div>
    <p id="cameraHint" class="small"></p>
  </section>

  <section id="result" class="card hidden"></section>

  <section class="card">
    <div class="row"><h2>سجلّي المحلي</h2><button id="clearBtn" class="ghost smallbtn">مسح السجل</button></div>
    <div id="history" class="history"></div>
  </section>

  <dialog id="settings">
    <form method="dialog" class="dialog">
      <h2>الأهداف</h2>
      <label><input type="checkbox" id="reflux" checked> مراعاة الحرقان/الارتجاع</label>
      <label><input type="checkbox" id="gas" checked> مراعاة الغازات والانتفاخ</label>
      <label><input type="checkbox" id="chol" checked> مراعاة الدهون المشبعة/الكوليسترول</label>
      <p class="small">تُحفظ الإعدادات وسجل الأعراض على هذا المتصفح فقط.</p>
      <button class="primary">حفظ</button>
    </form>
  </dialog>

  <dialog id="symptoms">
    <form method="dialog" class="dialog">
      <h2>كيف كان تأثيره؟</h2>
      <label><input type="checkbox" id="sHeart"> 🔥 حرقان</label>
      <label><input type="checkbox" id="sGas"> 💨 غازات</label>
      <label><input type="checkbox" id="sBloat"> 🎈 انتفاخ</label>
      <label>الشدة
        <select id="severity"><option value="1">خفيف</option><option value="2">متوسط</option><option value="3">شديد</option></select>
      </label>
      <button id="saveSymptoms" class="primary" value="default">حفظ</button>
    </form>
  </dialog>
</main>
<script src="app.js"></script>
</body>
</html>
